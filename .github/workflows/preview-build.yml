# Each PR will build preview site that help to check code is work as expect.

name: Preview Build

on: pull_request

jobs:

  build-site:
    name: build preview
    runs-on: ubuntu-latest

    steps:
      - name: checkout
        uses: actions/checkout@master

      - name: Setup .NET SDKs
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            3.1.x
            5.0.x
            6.0.x
            7.0.x
            8.0.x
            9.0.x
            10.0.x

      - name: Setup Node.js
        uses: actions/setup-node@v1
        with:
          node-version: "18.x"

      - name: build site
        id: site
        run: bash ./scripts/build-cloudflare-pages.sh _site/wwwroot
        env:
          PACKAGE_VERSION: ${{ github.event.number }}
          ENABLE_AOT: false

      - name: upload site artifact
        uses: actions/upload-artifact@v4
        with:
          name: site
          path: _site/wwwroot/
          retention-days: 5

      # Upload PR id for next workflow use
      - name: Save PR number
        if: ${{ always() }}
        run: echo ${{ github.event.number }} > ./pr-id.txt

      - name: Upload PR number
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: pr
          path: ./pr-id.txt
