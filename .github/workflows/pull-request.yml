name: Pull Request Checks

on:
  pull_request:
    branches:
      - master
      - feature

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v1

      - name: Setup .NET SDKs
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            3.1.x
            5.0.x
            6.0.x
            7.0.x
            8.0.x
            9.0.x
            10.0.x
            11.0.x
          include-prerelease: true

      - uses: actions/setup-node@v1
        with:
          node-version: "18.x"

      - name: Check Building ⚙
        run: |
          npm install
          dotnet build

  test:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - uses: actions/checkout@v1

      - name: Setup .NET SDKs
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            3.1.x
            5.0.x
            6.0.x
            7.0.x
            8.0.x
            9.0.x
            10.0.x
            11.0.x
          include-prerelease: true

      - uses: actions/setup-node@v1
        with:
          node-version: "18.x"

      - name: Install npm dependencies
        run: npm install

      - name: Lint
        run: npm run lint

      - name: Test (.NET 6)
        run: >-
          dotnet test ./tests/AntDesign.Tests/AntDesign.Tests.csproj --configuration:Release
          --collect:"XPlat Code Coverage" -f net6 --logger "console;verbosity=detailed"
          --blame-hang --blame-hang-timeout 10m

      - name: Test (.NET 8)
        run: >-
          dotnet test ./tests/AntDesign.Tests/AntDesign.Tests.csproj --configuration:Release
          --collect:"XPlat Code Coverage" -f net8 --logger "console;verbosity=detailed"
          --blame-hang --blame-hang-timeout 10m

      - name: Test (.NET 9)
        run: >-
          dotnet test ./tests/AntDesign.Tests/AntDesign.Tests.csproj --configuration:Release
          --collect:"XPlat Code Coverage" -f net9 --logger "console;verbosity=detailed"
          --blame-hang --blame-hang-timeout 10m

      - name: Test (.NET 10)
        run: >-
          dotnet test ./tests/AntDesign.Tests/AntDesign.Tests.csproj --configuration:Release
          --collect:"XPlat Code Coverage" -f net10.0 --logger "console;verbosity=detailed"
          --blame-hang --blame-hang-timeout 10m

      - name: Test (.NET 11 RC)
        run: >-
          dotnet test ./tests/AntDesign.Tests/AntDesign.Tests.csproj --configuration:Release
          --collect:"XPlat Code Coverage" -f net11.0 --logger "console;verbosity=detailed"
          --blame-hang --blame-hang-timeout 10m

      - name: Test JavaScript
        run: |
          npm install ./tests/AntDesign.Tests.Js
          npm --prefix ./tests/AntDesign.Tests.Js run test-cov

      - name: Collect coverage reports
        run: find ./coverage ./tests -name "*coverage*.xml" -type f -exec cp {} ./ \;

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.cobertura.xml,./cobertura-coverage.xml
          fail_ci_if_error: false
