name: Publish MCP package

on:
  release:
    types: [published]

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            11.0.x
          include-prerelease: true

      - name: Verify .NET
        run: |
          echo "dotnet --info"
          dotnet --info
          echo "ls -la site"
          ls -la site || true

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build -c Release --no-restore

      - name: Verify generated files are packaged
        run: |
          echo "Packing preview to nupkgs for verification"
          mkdir -p nupkgs
          dotnet pack site/AntDesign.Docs.MCP/AntDesign.Docs.MCP.csproj -c Release -o nupkgs -p:PackageVersion=0.0.0-test
          echo "Listing nupkg contents"
          unzip -l nupkgs/*.nupkg || true
          echo "Checking for data/ json files inside nupkg"
          unzip -l nupkgs/*.nupkg | grep "data/" || true

      - name: Set package version from tag
        id: vars
        run: |
          TAG="${{ github.event.release.tag_name }}"
          # strip leading v if present
          TAG="${TAG#v}"
          echo "package_version=$TAG" >> $GITHUB_OUTPUT

      - name: Pack MCP project
        run: |
          mkdir -p nupkgs
          echo "Packing with version ${{ steps.vars.outputs.package_version }}"
          dotnet pack site/AntDesign.Docs.MCP/AntDesign.Docs.MCP.csproj -c Release -o nupkgs -p:PackageVersion=${{ steps.vars.outputs.package_version }}

      - name: Publish to NuGet
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: |
          if [ -z "$NUGET_API_KEY" ]; then
            echo "No NUGET_API_KEY provided — skipping publish.";
            exit 0;
          fi
          dotnet nuget push "nupkgs/*.nupkg" -k "$NUGET_API_KEY" -s https://api.nuget.org/v3/index.json --skip-duplicate
