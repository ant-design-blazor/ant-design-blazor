# Each PR will build preview site that help to check code is work as expect.

name: Preview Deploy

on:
  workflow_run:
    workflows: ["Preview Build"]
    types:
      - completed

permissions:
  contents: read

jobs:
  deploy-cloudflare:
    name: deploy preview to Cloudflare
    runs-on: ubuntu-latest
    permissions:
      actions: read
    if: >
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'success'
    outputs:
      preview_url: ${{ steps.preview.outputs.url }}
    steps:
      # Read the PR number from GitHub's workflow_run payload, not an artifact
      # produced by untrusted pull request code.
      - name: save PR id
        id: pr
        env:
          PR_ID: ${{ github.event.workflow_run.pull_requests[0].number }}
        run: |
          if ! [[ "$PR_ID" =~ ^[0-9]+$ ]]; then
            echo "Invalid PR ID: Not a number"
            exit 1
          fi
          echo "id=$PR_ID" >> $GITHUB_OUTPUT

      # Download site artifact
      - name: download site artifact
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ github.event.workflow_run.id }}
          name: site
          path: site-artifact

      - name: set Cloudflare preview branch
        id: preview
        env:
          PR_ID: ${{ steps.pr.outputs.id }}
        run: |
          echo "branch=preview-pr-${PR_ID}" >> $GITHUB_OUTPUT
          echo "url=https://preview-pr-${PR_ID}.ant-design-blazor.pages.dev" >> $GITHUB_OUTPUT

      - name: Publish to Cloudflare Pages
        id: deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CF_TOKEN }}
          accountId: ${{ secrets.CF_ID }}
          command: pages deploy site-artifact --project-name=ant-design-blazor --branch=${{ steps.preview.outputs.branch }}

  update-preview-comment:
    name: update preview comment
    needs: deploy-cloudflare
    runs-on: ubuntu-latest
    permissions:
      issues: write
    if: >
      always() &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'success' &&
      needs.deploy-cloudflare.result == 'success'
    steps:
      - name: save PR id
        id: pr
        env:
          PR_ID: ${{ github.event.workflow_run.pull_requests[0].number }}
        run: |
          if ! [[ "$PR_ID" =~ ^[0-9]+$ ]]; then
            echo "Invalid PR ID: Not a number"
            exit 1
          fi
          echo "id=$PR_ID" >> $GITHUB_OUTPUT

      - name: Update status comment
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.pr.outputs.id }}
          PREVIEW_URL: ${{ needs.deploy-cloudflare.outputs.preview_url }}
        run: |
          cat > comment.md <<EOF
          [<img width="306" src="https://user-images.githubusercontent.com/5378891/72400743-23dbb200-3785-11ea-9d13-1a2d92743846.png">]($PREVIEW_URL)
          <!-- AUTO_PREVIEW_HOOK -->
          EOF
          comment_id=$(gh api --paginate "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" \
            --jq '.[] | select(.body | contains("<!-- AUTO_PREVIEW_HOOK -->")) | .id' | head -n 1)
          if [ -n "$comment_id" ]; then
            gh api "repos/$GITHUB_REPOSITORY/issues/comments/$comment_id" -X PATCH -f body="$(cat comment.md)"
          else
            gh api "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" -X POST -f body="$(cat comment.md)"
          fi

  preview-deploy-failed:
    name: report preview deploy failure
    needs: deploy-cloudflare
    runs-on: ubuntu-latest
    permissions:
      issues: write
    if: >
      always() &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'success' &&
      needs.deploy-cloudflare.result == 'failure'
    steps:
      - name: save PR id
        id: pr
        env:
          PR_ID: ${{ github.event.workflow_run.pull_requests[0].number }}
        run: |
          if ! [[ "$PR_ID" =~ ^[0-9]+$ ]]; then
            echo "Invalid PR ID: Not a number"
            exit 1
          fi
          echo "id=$PR_ID" >> $GITHUB_OUTPUT

      - name: Report deploy failure
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.pr.outputs.id }}
          PREVIEW_URL: https://preview-pr-${{ steps.pr.outputs.id }}.ant-design-blazor.pages.dev
        run: |
          cat > comment.md <<EOF
          [<img width="534" src="https://user-images.githubusercontent.com/5378891/75333447-1e63a280-58c1-11ea-975d-235367fd1522.png">]($PREVIEW_URL)
          <!-- AUTO_PREVIEW_HOOK -->
          EOF
          comment_id=$(gh api --paginate "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" \
            --jq '.[] | select(.body | contains("<!-- AUTO_PREVIEW_HOOK -->")) | .id' | head -n 1)
          if [ -n "$comment_id" ]; then
            gh api "repos/$GITHUB_REPOSITORY/issues/comments/$comment_id" -X PATCH -f body="$(cat comment.md)"
          else
            gh api "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" -X POST -f body="$(cat comment.md)"
          fi

  build-site-failed:
    name: build preview failed
    runs-on: ubuntu-latest
    permissions:
      issues: write
    if: >
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'failure'
    steps:
      # Read the PR number from the trusted workflow_run event payload.
      - name: save PR id
        id: pr
        env:
          PR_ID: ${{ github.event.workflow_run.pull_requests[0].number }}
        run: |
          if ! [[ "$PR_ID" =~ ^[0-9]+$ ]]; then
            echo "Invalid PR ID: Not a number"
            exit 1
          fi
          echo "id=$PR_ID" >> $GITHUB_OUTPUT

      - name: The job has failed
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.pr.outputs.id }}
          PREVIEW_URL: https://preview-pr-${{ steps.pr.outputs.id }}.ant-design-blazor.pages.dev
        run: |
          cat > comment.md <<EOF
          [<img width="534" src="https://user-images.githubusercontent.com/5378891/75333447-1e63a280-58c1-11ea-975d-235367fd1522.png">]($PREVIEW_URL)
          <!-- AUTO_PREVIEW_HOOK -->
          EOF
          comment_id=$(gh api --paginate "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" \
            --jq '.[] | select(.body | contains("<!-- AUTO_PREVIEW_HOOK -->")) | .id' | head -n 1)
          if [ -n "$comment_id" ]; then
            gh api "repos/$GITHUB_REPOSITORY/issues/comments/$comment_id" -X PATCH -f body="$(cat comment.md)"
          else
            gh api "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" -X POST -f body="$(cat comment.md)"
          fi
