# Each PR will build preview site that help to check code is work as expect.

name: Preview Deploy

on:
  workflow_run:
    workflows: ["Preview Build"]
    types:
      - completed

jobs:
  deploy-cloudflare:
    name: deploy preview to Cloudflare
    runs-on: ubuntu-latest
    if: >
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'success'
    steps:
      # We need get PR id first
      - name: download pr artifact
        uses: dawidd6/action-download-artifact@v2
        with:
          workflow: ${{ github.event.workflow_run.workflow_id }}
          name: pr

      # Save PR id to output and validate it's a number
      - name: save PR id
        id: pr
        run: |
          PR_ID=$(cat pr-id.txt)
          if ! [[ "$PR_ID" =~ ^[0-9]+$ ]]; then
            echo "Invalid PR ID: Not a number"
            exit 1
          fi
          echo "id=$PR_ID" >> $GITHUB_OUTPUT

      # Download site artifact
      - name: download site artifact
        uses: dawidd6/action-download-artifact@v2
        with:
          workflow: ${{ github.event.workflow_run.workflow_id }}
          workflow_conclusion: success
          name: site

      - name: Compress Blazor boot resources
        run: |
          sudo apt-get update
          sudo apt-get install -y brotli
          find _framework -type f \( -name '*.wasm' -o -name '*.dll' -o -name '*.pdb' -o -name '*.dat' \) -exec brotli -f -q 11 {} \;
          find _framework -type f \( -name '*.wasm' -o -name '*.dll' -o -name '*.pdb' -o -name '*.dat' \) -delete

      - name: set Cloudflare preview branch
        id: preview
        env:
          PR_ID: ${{ steps.pr.outputs.id }}
        run: |
          echo "branch=preview-pr-${PR_ID}" >> $GITHUB_OUTPUT

      - name: Publish to Cloudflare Pages
        id: deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CF_TOKEN }}
          accountId: ${{ secrets.CF_ID }}
          command: pages deploy . --project-name=ant-design-blazor --branch=${{ steps.preview.outputs.branch }}

  update-preview-comment:
    name: update preview comment
    needs: deploy-cloudflare
    runs-on: ubuntu-latest
    if: >
      always() &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'success' &&
      needs.deploy-cloudflare.result == 'success'
    steps:
      - name: download pr artifact
        uses: dawidd6/action-download-artifact@v2
        with:
          workflow: ${{ github.event.workflow_run.workflow_id }}
          name: pr

      - name: save PR id
        id: pr
        run: |
          PR_ID=$(cat pr-id.txt)
          if ! [[ "$PR_ID" =~ ^[0-9]+$ ]]; then
            echo "Invalid PR ID: Not a number"
            exit 1
          fi
          echo "id=$PR_ID" >> $GITHUB_OUTPUT

      - name: set Cloudflare preview branch
        id: preview
        env:
          PR_ID: ${{ steps.pr.outputs.id }}
        run: echo "branch=preview-pr-${PR_ID}" >> $GITHUB_OUTPUT

      - name: Update status comment
        uses: actions-cool/maintain-one-comment@v1.1.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          body: |
            [<img width="306" src="https://user-images.githubusercontent.com/5378891/72400743-23dbb200-3785-11ea-9d13-1a2d92743846.png">](https://${{ steps.preview.outputs.branch }}.ant-design-blazor.pages.dev)
            <!-- AUTO_PREVIEW_HOOK -->
          body-include: '<!-- AUTO_PREVIEW_HOOK -->'
          number: ${{ steps.pr.outputs.id }}

  preview-deploy-failed:
    name: report preview deploy failure
    needs: deploy-cloudflare
    runs-on: ubuntu-latest
    if: >
      always() &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'success' &&
      needs.deploy-cloudflare.result == 'failure'
    steps:
      - name: download pr artifact
        uses: dawidd6/action-download-artifact@v2
        with:
          workflow: ${{ github.event.workflow_run.workflow_id }}
          name: pr

      - name: save PR id
        id: pr
        run: |
          PR_ID=$(cat pr-id.txt)
          if ! [[ "$PR_ID" =~ ^[0-9]+$ ]]; then
            echo "Invalid PR ID: Not a number"
            exit 1
          fi
          echo "id=$PR_ID" >> $GITHUB_OUTPUT

      - name: Report deploy failure
        uses: actions-cool/maintain-one-comment@v1.1.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          body: |
            <img width="534" src="https://user-images.githubusercontent.com/5378891/75333447-1e63a280-58c1-11ea-975d-235367fd1522.png">
            <!-- AUTO_PREVIEW_HOOK -->
          body-include: '<!-- AUTO_PREVIEW_HOOK -->'
          number: ${{ steps.pr.outputs.id }}

  build-site-failed:
    name: build preview failed
    runs-on: ubuntu-latest
    if: >
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'failure'
    steps:
      # We need get PR id first
      - name: download pr artifact
        uses: dawidd6/action-download-artifact@v2
        with:
          workflow: ${{ github.event.workflow_run.workflow_id }}
          name: pr

      # Save PR id to output and validate it's a number
      - name: save PR id
        id: pr
        run: |
          PR_ID=$(cat pr-id.txt)
          if ! [[ "$PR_ID" =~ ^[0-9]+$ ]]; then
            echo "Invalid PR ID: Not a number"
            exit 1
          fi
          echo "id=$PR_ID" >> $GITHUB_OUTPUT

      - name: The job has failed
        uses: actions-cool/maintain-one-comment@v1.1.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          body: |
            <img width="534" src="https://user-images.githubusercontent.com/5378891/75333447-1e63a280-58c1-11ea-975d-235367fd1522.png">
            <!-- AUTO_PREVIEW_HOOK -->
          body-include: '<!-- AUTO_PREVIEW_HOOK -->'
          number: ${{ steps.pr.outputs.id }}
