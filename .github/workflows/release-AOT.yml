name: Publish Docs with AOT

on:
  push:
    tags:
      - "*"
    branches:
      - doc-fix

jobs:
  build-site:
    name: Build docs site
    runs-on: ubuntu-latest
    if: github.repository_owner == 'ant-design-blazor'

    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup .NET SDKs
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            3.1.x
            5.0.x
            6.0.x
            7.0.x
            8.0.x
            9.0.x
            10.0.x

      - uses: actions/setup-node@v1
        with:
          node-version: "18.x"

      - name: Build Docs 🎉
        run: bash ./scripts/build-cloudflare-pages.sh cargo/wwwroot
        env:
          PACKAGE_VERSION: ${{ github.ref_name }}
          ENABLE_AOT: true
          KEEP_ORIGINALS: true

      - name: Upload site artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-site
          path: cargo/wwwroot/
          retention-days: 7

  deploy-cloudflare:
    name: Publish to Cloudflare Pages
    needs: build-site
    runs-on: ubuntu-latest
    if: github.repository_owner == 'ant-design-blazor'
    steps:
      - name: Download site artifact
        uses: actions/download-artifact@v4
        with:
          name: release-site
          path: cargo/wwwroot

      - name: Use publish-generated Brotli resources
        run: |
          while IFS= read -r -d '' file; do
            if [ -f "${file}.br" ]; then
              rm "${file}"
            fi
          done < <(find cargo/wwwroot/_framework -type f \( -name '*.wasm' -o -name '*.dll' -o -name '*.pdb' -o -name '*.dat' \) -print0)

      - name: Deploy to Cloudflare Pages 🚀
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CF_TOKEN }}
          accountId: ${{ secrets.CF_ID }}
          command: pages deploy cargo/wwwroot --project-name=ant-design-blazor --branch=master

  deploy-github-pages:
    name: Push to GitHub Pages
    needs: build-site
    runs-on: ubuntu-latest
    if: github.repository_owner == 'ant-design-blazor'
    steps:
      - name: Download site artifact
        uses: actions/download-artifact@v4
        with:
          name: release-site
          path: cargo/wwwroot

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./cargo/wwwroot
          publish_branch: gh-pages
          force_orphan: true

      # - name: Sync to Gitee 💕
      #   uses: wearerequired/git-mirror-action@master
      #   env:
      #     SSH_PRIVATE_KEY: ${{ secrets.GITEE_PRIVATE_KEY }}
      #   with:
      #     source-repo: "git@github.com:ant-design-blazor/ant-design-blazor.git"
      #     destination-repo: "git@gitee.com:ant-design-blazor/ant-design-blazor.git"
